<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mirror - 登录</title>
<style>
:root {
  --bg: #F5F5F7;
  --surface: #FFFFFF;
  --text-primary: #1D1D1F;
  --text-secondary: #6E6E73;
  --text-tertiary: #AEAEB2;
  --accent: #4F46E5;
  --accent-light: #EEF0FF;
  --accent-hover: #4338CA;
  --border: #E8E8ED;
  --error: #FF3B30;
  --error-light: #FFE5E3;
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.1);
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Noto Sans CJK SC", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* ===== Auth Container ===== */
.auth-container {
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Header ===== */
.auth-header {
  padding: 40px 32px 0;
  text-align: center;
}
.auth-logo {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: linear-gradient(135deg, #4F46E5, #7C3AED);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  box-shadow: 0 8px 24px rgba(79,70,229,0.3);
}
.auth-logo svg { width: 32px; height: 32px; stroke: #fff; }
.auth-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.auth-subtitle { font-size: 14px; color: var(--text-secondary); }

/* ===== Body ===== */
.auth-body { padding: 32px; }

/* ===== Form ===== */
.form-group { margin-bottom: 20px; }
.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.form-input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 16px;
  font-family: var(--font);
  color: var(--text-primary);
  outline: none;
  transition: all 0.2s ease;
}
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.form-input.error { border-color: var(--error); }
.form-input::placeholder { color: var(--text-tertiary); }

.form-hint {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 6px;
}
.form-error {
  font-size: 12px;
  color: var(--error);
  margin-top: 6px;
  display: none;
}
.form-error.show { display: block; }

/* ===== Buttons ===== */
.btn {
  width: 100%;
  padding: 14px 24px;
  border: none;
  border-radius: var(--radius-md);
  font-size: 16px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-secondary {
  background: var(--bg);
  color: var(--text-secondary);
  margin-top: 12px;
}
.btn-secondary:hover { background: var(--border); }

/* ===== Divider ===== */
.divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 24px 0;
  color: var(--text-tertiary);
  font-size: 13px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 0.5px;
  background: var(--border);
}

/* ===== Checkbox ===== */
.checkbox-group {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
}
.checkbox {
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.checkbox.checked {
  background: var(--accent);
  border-color: var(--accent);
}
.checkbox.checked svg { opacity: 1; }
.checkbox svg { width: 12px; height: 12px; stroke: #fff; opacity: 0; transition: opacity 0.2s; }
.checkbox-label { font-size: 14px; color: var(--text-secondary); cursor: pointer; }

/* ===== Password Strength ===== */
.strength-bar {
  display: flex;
  gap: 4px;
  margin-top: 8px;
}
.strength-segment {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  transition: background 0.3s ease;
}
.strength-segment.active.weak { background: var(--error); }
.strength-segment.active.medium { background: #FF9F0A; }
.strength-segment.active.strong { background: #34C759; }

.strength-text {
  font-size: 12px;
  margin-top: 6px;
  color: var(--text-tertiary);
}
.strength-text.weak { color: var(--error); }
.strength-text.medium { color: #FF9F0A; }
.strength-text.strong { color: #34C759; }

/* ===== Pages ===== */
.auth-page { display: none; }
.auth-page.active { display: block; animation: fadeIn 0.3s ease; }

/* ===== Footer ===== */
.auth-footer {
  padding: 20px 32px;
  text-align: center;
  border-top: 0.5px solid var(--border);
}
.auth-footer-text {
  font-size: 12px;
  color: var(--text-tertiary);
}

/* ===== Welcome Page ===== */
.welcome-features {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 24px 0;
}
.welcome-feature {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  background: var(--bg);
  border-radius: var(--radius-md);
}
.welcome-feature-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.welcome-feature-icon svg { width: 18px; height: 18px; stroke: var(--accent); }
.welcome-feature-text { flex: 1; }
.welcome-feature-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.welcome-feature-desc { font-size: 12px; color: var(--text-secondary); }

/* ===== Unlock Page ===== */
.unlock-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4F46E5, #7C3AED);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
}
.unlock-avatar svg { width: 40px; height: 40px; stroke: #fff; }

/* ===== Desktop ===== */
@media (min-width: 768px) {
  body { padding: 40px; }
  .auth-container { max-width: 440px; }
  .auth-header { padding: 48px 40px 0; }
  .auth-body { padding: 40px; }
  .auth-footer { padding: 24px 40px; }
}
</style>
</head>
<body>

<div class="auth-container" id="auth-container">

  <!-- ===== Welcome Page (First Time) ===== -->
  <div class="auth-page active" id="page-welcome">
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/></svg>
      </div>
      <h1 class="auth-title">欢迎使用 Mirror</h1>
      <p class="auth-subtitle">你的 AI 日记伙伴</p>
    </div>

    <div class="auth-body">
      <div class="welcome-features">
        <div class="welcome-feature">
          <div class="welcome-feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </div>
          <div class="welcome-feature-text">
            <div class="welcome-feature-title">随手记录</div>
            <div class="welcome-feature-desc">随时记录你的想法和日常</div>
          </div>
        </div>
        <div class="welcome-feature">
          <div class="welcome-feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/></svg>
          </div>
          <div class="welcome-feature-text">
            <div class="welcome-feature-title">AI 整理</div>
            <div class="welcome-feature-desc">自动分类、打标签、生成摘要</div>
          </div>
        </div>
        <div class="welcome-feature">
          <div class="welcome-feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="welcome-feature-text">
            <div class="welcome-feature-title">认识自己</div>
            <div class="welcome-feature-desc">AI 生成你的专属画像</div>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" onclick="showSetup()">开始使用</button>
      <button class="btn btn-secondary" onclick="skipSetup()">跳过，直接使用</button>
    </div>

    <div class="auth-footer">
      <p class="auth-footer-text">数据存储在本地，隐私安全</p>
    </div>
  </div>

  <!-- ===== Setup Password Page ===== -->
  <div class="auth-page" id="page-setup">
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 class="auth-title">设置密码</h1>
      <p class="auth-subtitle">保护你的隐私日记</p>
    </div>

    <div class="auth-body">
      <div class="form-group">
        <label class="form-label">访问密码</label>
        <input type="password" class="form-input" id="setup-password" placeholder="请输入密码" oninput="checkStrength()">
        <div class="strength-bar">
          <div class="strength-segment" id="str-1"></div>
          <div class="strength-segment" id="str-2"></div>
          <div class="strength-segment" id="str-3"></div>
        </div>
        <div class="strength-text" id="strength-text"></div>
      </div>

      <div class="form-group">
        <label class="form-label">确认密码</label>
        <input type="password" class="form-input" id="setup-confirm" placeholder="请再次输入密码" oninput="validateConfirm()">
        <div class="form-error" id="confirm-error">两次输入的密码不一致</div>
      </div>

      <button class="btn btn-primary" id="setup-btn" onclick="setupPassword()">设置密码</button>
      <button class="btn btn-secondary" onclick="goToUnlock()">我再想想</button>
    </div>

    <div class="auth-footer">
      <p class="auth-footer-text">密码仅存储在本地，不会上传到任何服务器</p>
    </div>
  </div>

  <!-- ===== Unlock Page ===== -->
  <div class="auth-page" id="page-unlock">
    <div class="auth-header">
      <div class="unlock-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/></svg>
      </div>
      <h1 class="auth-title">Mirror</h1>
      <p class="auth-subtitle">请输入密码解锁</p>
    </div>

    <div class="auth-body">
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" id="unlock-password" placeholder="请输入访问密码" oninput="clearError()">
        <div class="form-error" id="unlock-error">密码错误，请重试</div>
      </div>

      <div class="checkbox-group" onclick="toggleRemember()">
        <div class="checkbox" id="remember-checkbox">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="checkbox-label">7天内免密登录</span>
      </div>

      <button class="btn btn-primary" id="unlock-btn" onclick="unlock()">解锁</button>
      <button class="btn btn-secondary" onclick="clearPassword()">清除密码</button>
    </div>

    <div class="auth-footer">
      <p class="auth-footer-text">数据存储在本地，隐私安全</p>
    </div>
  </div>

  <!-- ===== Success Page ===== -->
  <div class="auth-page" id="page-success">
    <div class="auth-header">
      <div class="auth-logo" style="background: linear-gradient(135deg, #34C759, #30D158);">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1 class="auth-title">设置成功</h1>
      <p class="auth-subtitle" id="success-message">密码已设置，即将进入主页</p>
    </div>

    <div class="auth-body" style="text-align: center;">
      <button class="btn btn-primary" onclick="enterApp()">进入 Mirror</button>
    </div>
  </div>

</div>

<script>
// State
let hasPassword = false;
let rememberMe = true;

// Check if password is set (simulate)
function init() {
  const stored = localStorage.getItem('mirror_password');
  if (stored) {
    hasPassword = true;
    showPage('page-unlock');
  } else {
    hasPassword = false;
    showPage('page-welcome');
  }
}

function showPage(pageId) {
  document.querySelectorAll('.auth-page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}

// Welcome -> Setup
function showSetup() {
  showPage('page-setup');
}

// Welcome -> Skip -> Enter App
function skipSetup() {
  localStorage.setItem('mirror_skip_password', 'true');
  enterApp();
}

// Setup Password
function checkStrength() {
  const password = document.getElementById('setup-password').value;
  const strength = getPasswordStrength(password);

  const segments = [document.getElementById('str-1'), document.getElementById('str-2'), document.getElementById('str-3')];
  const strengthText = document.getElementById('strength-text');

  segments.forEach(s => { s.className = 'strength-segment'; });

  if (password.length === 0) {
    strengthText.textContent = '';
    strengthText.className = 'strength-text';
    return;
  }

  if (strength === 'weak') {
    segments[0].classList.add('active', 'weak');
    strengthText.textContent = '弱 - 建议使用更复杂的密码';
    strengthText.className = 'strength-text weak';
  } else if (strength === 'medium') {
    segments[0].classList.add('active', 'medium');
    segments[1].classList.add('active', 'medium');
    strengthText.textContent = '中等';
    strengthText.className = 'strength-text medium';
  } else {
    segments.forEach(s => { s.classList.add('active', 'strong'); });
    strengthText.textContent = '强';
    strengthText.className = 'strength-text strong';
  }

  validateConfirm();
}

function getPasswordStrength(password) {
  if (password.length < 6) return 'weak';
  if (password.length < 10 && !/[A-Z]/.test(password)) return 'medium';
  if (password.length >= 10 || (/[A-Z]/.test(password) && /[0-9]/.test(password))) return 'strong';
  return 'medium';
}

function validateConfirm() {
  const password = document.getElementById('setup-password').value;
  const confirm = document.getElementById('setup-confirm').value;
  const error = document.getElementById('confirm-error');
  const btn = document.getElementById('setup-btn');

  if (confirm.length === 0) {
    error.classList.remove('show');
    btn.disabled = true;
    return false;
  }

  if (password !== confirm) {
    error.classList.add('show');
    btn.disabled = true;
    return false;
  }

  error.classList.remove('show');
  btn.disabled = false;
  return true;
}

function setupPassword() {
  if (!validateConfirm()) return;

  const password = document.getElementById('setup-password').value;
  localStorage.setItem('mirror_password', btoa(password)); // Simple encode (not secure, demo only)
  localStorage.setItem('mirror_skip_password', 'false');

  document.getElementById('success-message').textContent = '密码已设置，即将进入主页';
  showPage('page-success');
}

// Unlock
function toggleRemember() {
  const checkbox = document.getElementById('remember-checkbox');
  rememberMe = !rememberMe;
  checkbox.classList.toggle('checked', rememberMe);
}

function clearError() {
  document.getElementById('unlock-error').classList.remove('show');
  document.getElementById('unlock-password').classList.remove('error');
}

function unlock() {
  const password = document.getElementById('unlock-password').value;
  const stored = localStorage.getItem('mirror_password');

  if (password.length === 0) {
    document.getElementById('unlock-error').textContent = '请输入密码';
    document.getElementById('unlock-error').classList.add('show');
    return;
  }

  if (atob(stored) === password) {
    if (rememberMe) {
      const expires = Date.now() + 7 * 24 * 60 * 60 * 1000;
      localStorage.setItem('mirror_token_expires', expires);
    }
    document.getElementById('success-message').textContent = '验证成功，即将进入主页';
    showPage('page-success');
  } else {
    document.getElementById('unlock-error').textContent = '密码错误，请重试';
    document.getElementById('unlock-error').classList.add('show');
    document.getElementById('unlock-password').classList.add('error');
    document.getElementById('unlock-password').value = '';
  }
}

// Clear Password (for demo)
function clearPassword() {
  if (confirm('确定要清除密码吗？清除后任何人都可以直接访问。')) {
    localStorage.removeItem('mirror_password');
    localStorage.removeItem('mirror_token_expires');
    hasPassword = false;
    showPage('page-welcome');
  }
}

// Enter App
function enterApp() {
  // In real app, this would redirect to main page
  alert('即将进入 Mirror 主页\n\n（这是登录原型演示，实际会跳转到主页）');
}

// Init
init();
</script>
</body>
</html>
