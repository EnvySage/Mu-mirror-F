<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mirror · 镜子 — AI 日记 v2 原型</title>
<style>
/* ============ Tokens ============ */
:root {
  --ink: #0B0E1A;               /* 基色：深蓝黑 */
  --ink-2: #101427;             /* 面板底 */
  --glass: rgba(255,255,255,.055);
  --glass-2: rgba(255,255,255,.085);
  --line: rgba(255,255,255,.09);
  --line-strong: rgba(255,255,255,.16);
  --text-hi: #EDF0FA;
  --text-mid: #9AA3C0;
  --text-low: #5A617E;
  --cyan: #6EE7F0;              /* 光谱青 */
  --violet: #A78BFA;            /* 光谱紫 */
  --accent-grad: linear-gradient(100deg, #6EE7F0, #A78BFA 60%, #E879F9);
  --danger: #FF6B81; --danger-bg: rgba(255,107,129,.12);
  --success: #4ADE9C; --success-bg: rgba(74,222,156,.12);
  --warn: #FFC862; --warn-bg: rgba(255,200,98,.12);
  --processing: #818CF8; --processing-bg: rgba(129,140,248,.12);
  --radius: 16px; --radius-sm: 10px; --radius-full: 9999px;
  --shadow: 0 8px 32px rgba(0,0,0,.45);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-mono: ui-monospace, "SF Mono", "Fira Code", Consolas, monospace;
  --nav-height: 62px;
  --sidebar-width: 264px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font); background: var(--ink); color: var(--text-hi);
  line-height: 1.65; overflow: hidden; height: 100dvh; width: 100vw;
}
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, select { font-family: inherit; color: var(--text-hi); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 4px; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 4px; }

/* ============ Aurora background（氛围，不是装饰） ============ */
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(52vw 42vh at 8% -6%, rgba(110,231,240,.13), transparent 62%),
    radial-gradient(58vw 50vh at 96% 104%, rgba(167,139,250,.14), transparent 62%),
    radial-gradient(40vw 34vh at 78% 6%, rgba(232,121,249,.05), transparent 60%);
}

/* ============ App frame ============ */
.app { position: relative; z-index: 1; display: flex; height: 100dvh; }

/* ============ Sidebar（桌面） ============ */
.sidebar { display: none; width: var(--sidebar-width); flex-shrink: 0; flex-direction: column;
  border-right: 1px solid var(--line); background: rgba(255,255,255,.025); backdrop-filter: blur(24px); padding: 22px 16px; overflow-y: auto; }
.sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 2px 8px 20px; }
.sidebar-logo-icon { width: 34px; height: 34px; border-radius: 11px; background: var(--accent-grad); display: grid; place-items: center; box-shadow: 0 4px 18px rgba(110,231,240,.25); }
.sidebar-logo-icon svg { width: 18px; height: 18px; stroke: #0B0E1A; }
.sidebar-logo-text { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: .04em; }
.sidebar-logo-sub { font-size: 11px; color: var(--text-low); letter-spacing: .18em; margin-top: -2px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.sidebar-nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--text-mid); font-size: 14.5px; transition: all .18s; text-align: left; }
.sidebar-nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }
.sidebar-nav-item:hover { background: var(--glass); color: var(--text-hi); }
.sidebar-nav-item.active { background: var(--glass-2); color: var(--text-hi); box-shadow: inset 0 0 0 1px var(--line); }
.sidebar-nav-item.active svg { stroke: var(--cyan); }
.sidebar-spacer { flex: 1; min-height: 14px; }
.sidebar-write { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 13px;
  background: var(--accent-grad); color: #0B0E1A; font-weight: 600; font-size: 15px; box-shadow: 0 6px 22px rgba(110,231,240,.22); transition: transform .15s; }
.sidebar-write:active { transform: scale(.97); }
.sidebar-write svg { width: 17px; height: 17px; stroke: #0B0E1A; stroke-width: 2.4; fill: none; }
.sidebar-user { display: flex; align-items: center; gap: 10px; padding: 14px 8px 0; border-top: 1px solid var(--line); margin-top: 16px; }
.sidebar-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--glass-2); display: grid; place-items: center; font-size: 13px; color: var(--cyan); box-shadow: inset 0 0 0 1px var(--line-strong); }
.sidebar-user-name { font-size: 14px; }
.sidebar-user-hint { font-size: 11px; color: var(--text-low); }

/* ============ Main ============ */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.mobile-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 10px; }
.mobile-header .page-title-sm { font-family: var(--font-display); font-size: 21px; font-weight: 600; }
.header-actions { display: flex; gap: 8px; }
.header-icon-btn { width: 36px; height: 36px; border-radius: 12px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; }
.header-icon-btn svg { width: 17px; height: 17px; stroke: var(--text-mid); fill: none; stroke-width: 1.8; }

.page { display: none; flex: 1; min-height: 0; flex-direction: column; }
.page.active { display: flex; }
.page-header { display: none; padding: 26px 32px 0; align-items: baseline; gap: 14px; }
.page-title { font-family: var(--font-display); font-size: 26px; font-weight: 600; }
.page-subtitle { font-size: 13px; color: var(--text-low); }
.page-content { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 18px calc(96px + var(--safe-bottom)); -webkit-overflow-scrolling: touch; }
.page-content::-webkit-scrollbar { width: 3px; }

/* ============ 通用玻璃卡 ============ */
.card { background: var(--glass); border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line); backdrop-filter: blur(18px); }

/* ============ 记录卡片 ============ */
.date-separator { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-low); letter-spacing: .12em; margin: 18px 4px 8px; display: flex; align-items: center; gap: 10px; }
.date-separator::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.record-card { padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: all .18s; position: relative; overflow: hidden; }
.record-card::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 2.5px; border-radius: 3px; background: var(--accent-grad); opacity: 0; transition: opacity .18s; }
.record-card:hover { background: var(--glass-2); }
.record-card:active { transform: scale(.985); }
.record-card.active::before { opacity: 1; }
.record-card.processing::before, .record-card.failed::before { background: none; }
.record-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.record-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-low); }
.record-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.record-title { font-size: 15.5px; font-weight: 600; line-height: 1.45; }
.record-summary { font-size: 13px; color: var(--text-mid); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.record-keywords { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.record-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.chunk-count { font-family: var(--font-mono); font-size: 11px; color: var(--violet); display: inline-flex; align-items: center; gap: 5px; }
.chunk-count svg { width: 12px; height: 12px; stroke: var(--violet); fill: none; stroke-width: 2; }

/* 标签 chips */
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2.5px 9px; border-radius: var(--radius-full); box-shadow: inset 0 0 0 1px var(--line); color: var(--text-mid); }
.tag .dot { width: 5px; height: 5px; border-radius: 50%; }
.tag-type { color: var(--violet); box-shadow: inset 0 0 0 1px rgba(167,139,250,.35); }
.tag-processing { color: var(--processing); box-shadow: inset 0 0 0 1px rgba(129,140,248,.35); }
.tag-status { font-family: var(--font-mono); font-size: 10.5px; }
.keyword { font-size: 12px; color: var(--text-low); }
.keyword::before { content: "#"; color: var(--cyan); opacity: .7; }

/* ============ 状态相关 ============ */
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(129,140,248,.25); border-top-color: var(--processing); animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.status-failed-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--danger); margin-top: 4px; }

/* ============ 空状态 ============ */
.empty-state { text-align: center; padding: 60px 20px; }
.empty-icon { width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 18px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; }
.empty-icon svg { width: 22px; height: 22px; stroke: var(--text-low); fill: none; stroke-width: 1.6; }
.empty-title { font-size: 15px; color: var(--text-mid); }
.empty-desc { font-size: 12.5px; color: var(--text-low); margin-top: 4px; }

/* ============ 写日记 modal ============ */
.modal-overlay { position: fixed; inset: 0; background: rgba(5,7,15,.6); backdrop-filter: blur(4px); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.write-modal { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 110%); width: 100%; max-width: 640px; z-index: 41;
  background: rgba(19,23,44,.92); backdrop-filter: blur(28px); border-radius: 22px 22px 0 0; box-shadow: 0 -12px 48px rgba(0,0,0,.5), inset 0 1px 0 var(--line-strong); transition: transform .32s cubic-bezier(.32,.72,.28,1); padding-bottom: var(--safe-bottom); }
.write-modal.show { transform: translate(-50%, 0); }
.write-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 8px; }
.write-cancel { font-size: 14.5px; color: var(--text-mid); padding: 6px 2px; }
.write-header-title { font-family: var(--font-display); font-size: 15px; }
.write-submit { font-size: 14.5px; font-weight: 600; color: var(--text-low); padding: 7px 16px; border-radius: var(--radius-full); transition: all .2s; }
.write-submit.enabled { color: #0B0E1A; background: var(--accent-grad); box-shadow: 0 4px 16px rgba(110,231,240,.3); }
.write-body { padding: 4px 20px 20px; }
.write-textarea { width: 100%; min-height: 130px; background: transparent; border: none; resize: none; font-size: 16px; line-height: 1.7; }
.write-textarea::placeholder { color: var(--text-low); }
.write-textarea:focus { outline: none; }
.write-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.write-hint { font-size: 12px; color: var(--text-low); display: flex; align-items: center; gap: 6px; }
.write-hint svg { width: 13px; height: 13px; stroke: var(--cyan); fill: none; stroke-width: 1.8; flex-shrink: 0; }
.write-counter { font-family: var(--font-mono); font-size: 11px; color: var(--text-low); }

/* ============ 详情 / 审核 panel ============ */
.detail-page { position: fixed; inset: 0; z-index: 30; background: var(--ink); transform: translateX(102%); transition: transform .3s cubic-bezier(.32,.72,.28,1); display: flex; flex-direction: column; }
.detail-page.show { transform: translateX(0); }
.detail-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.02); }
.detail-back { display: flex; align-items: center; gap: 4px; font-size: 14.5px; color: var(--text-mid); padding: 6px 8px; }
.detail-back svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; }
.detail-title { font-size: 14px; color: var(--text-mid); }
.detail-confirm { font-size: 13.5px; font-weight: 600; color: #0B0E1A; background: var(--accent-grad); padding: 7px 18px; border-radius: var(--radius-full); box-shadow: 0 4px 14px rgba(110,231,240,.25); display: none; }
.detail-confirm.show { display: block; }
.detail-confirm:disabled { opacity: .55; }
.detail-content { flex: 1; overflow-y: auto; padding: 16px 18px calc(40px + var(--safe-bottom)); }

/* 原文面板 —— “光源” */
.review-original { position: relative; padding: 14px 16px; margin-bottom: 14px; border-radius: var(--radius); background: linear-gradient(160deg, rgba(110,231,240,.07), rgba(167,139,250,.06)); box-shadow: inset 0 0 0 1px rgba(110,231,240,.18); }
.review-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .16em; color: var(--text-low); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.review-label svg { width: 12px; height: 12px; stroke: var(--cyan); fill: none; stroke-width: 1.8; }
.review-original-text { font-size: 14px; line-height: 1.8; color: var(--text-hi); }

/* 片段卡片 —— “镜面反射” */
.review-list-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .16em; color: var(--text-low); margin: 4px 2px 10px; display: flex; justify-content: space-between; align-items: center; }
.chunk-card { position: relative; padding: 16px 16px 14px 20px; margin-bottom: 12px; }
.chunk-card::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--accent-grad); opacity: .85; }
.chunk-card.adding { animation: chunkIn .3s ease; }
@keyframes chunkIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.chunk-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.chunk-index { font-family: var(--font-mono); font-size: 10.5px; color: var(--violet); letter-spacing: .1em; }
.chunk-actions { display: flex; gap: 4px; }
.chunk-icon-btn { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; transition: background .15s; }
.chunk-icon-btn svg { width: 14px; height: 14px; stroke: var(--text-low); fill: none; stroke-width: 1.8; }
.chunk-icon-btn:hover { background: var(--glass-2); }
.chunk-icon-btn.danger:hover svg { stroke: var(--danger); }
.chunk-segment { width: 100%; background: transparent; border: none; resize: none; font-size: 14.5px; line-height: 1.75; min-height: 44px; border-radius: 8px; padding: 2px 0; }
.chunk-segment:focus { outline: none; }
.chunk-field { margin-top: 12px; }
.chunk-field-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; color: var(--text-low); margin-bottom: 6px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 4px 11px; border-radius: var(--radius-full); box-shadow: inset 0 0 0 1px var(--line); color: var(--text-mid); transition: all .15s; }
.chip.selected { color: #0B0E1A; background: var(--accent-grad); box-shadow: none; font-weight: 600; }
.chip.mood-chip.selected { background: none; box-shadow: inset 0 0 0 1.5px currentColor; color: inherit; font-weight: 500; }
.chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin-right: 5px; display: inline-block; vertical-align: 1px; }
.keywords-input { width: 100%; background: var(--glass); border: none; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--line); padding: 8px 12px; font-size: 13px; }
.keywords-input:focus { outline: none; box-shadow: inset 0 0 0 1px rgba(110,231,240,.4); }
.add-chunk-btn { width: 100%; padding: 13px; border-radius: var(--radius); border: 1.5px dashed var(--line-strong); color: var(--text-low); font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 7px; transition: all .18s; }
.add-chunk-btn:hover { color: var(--cyan); border-color: rgba(110,231,240,.4); }
.add-chunk-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
.review-hint { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--text-low); line-height: 1.6; padding: 12px 14px; margin-top: 4px; border-radius: var(--radius-sm); background: rgba(255,200,98,.06); box-shadow: inset 0 0 0 1px rgba(255,200,98,.15); }
.review-hint svg { width: 14px; height: 14px; stroke: var(--warn); fill: none; stroke-width: 1.8; flex-shrink: 0; margin-top: 2px; }

/* 处理中视图 */
.processing-view { text-align: center; padding: 70px 20px; }
.processing-ring { width: 58px; height: 58px; margin: 0 auto 22px; border-radius: 50%; border: 2.5px solid rgba(110,231,240,.15); border-top-color: var(--cyan); animation: spin 1.1s linear infinite; }
.processing-title { font-family: var(--font-display); font-size: 17px; }
.processing-desc { font-size: 12.5px; color: var(--text-low); margin-top: 6px; }
.processing-steps { margin-top: 26px; display: inline-flex; flex-direction: column; gap: 12px; text-align: left; }
.processing-step { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text-low); transition: color .3s; }
.processing-step-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); transition: all .3s; }
.processing-step.active { color: var(--text-hi); }
.processing-step.active .processing-step-dot { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: pulse 1s infinite alternate; }
.processing-step.done { color: var(--text-mid); }
.processing-step.done .processing-step-dot { background: var(--success); }
@keyframes pulse { to { opacity: .5; } }

/* ============ 镜子页 ============ */
.mirror-hero { position: relative; overflow: hidden; padding: 26px 22px; margin-top: 8px; text-align: left; }
.mirror-hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.07) 46%, rgba(110,231,240,.06) 50%, transparent 66%); background-size: 240% 100%; animation: sheen 7s ease-in-out infinite; pointer-events: none; }
@keyframes sheen { 0%, 55% { background-position: 130% 0; } 85%, 100% { background-position: -60% 0; } }
.mirror-greeting { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .22em; color: var(--cyan); margin-bottom: 8px; }
.mirror-name { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1.3; }
.mirror-drift { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12px; color: var(--violet); padding: 4px 12px; border-radius: var(--radius-full); background: rgba(167,139,250,.1); box-shadow: inset 0 0 0 1px rgba(167,139,250,.3); }
.mirror-drift svg { width: 12px; height: 12px; stroke: var(--violet); fill: none; stroke-width: 2; }
.mirror-overall { font-size: 14px; line-height: 1.85; color: var(--text-mid); margin-top: 14px; }
.mirror-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.mirror-stat { text-align: center; padding: 12px 6px; border-radius: var(--radius-sm); background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px var(--line); }
.mirror-stat-num { font-family: var(--font-display); font-size: 21px; font-weight: 600; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.mirror-stat-label { font-size: 11px; color: var(--text-low); margin-top: 1px; }
.mirror-generate { margin-top: 16px; width: 100%; padding: 12px; border-radius: 13px; font-size: 14px; font-weight: 600; color: var(--text-mid); box-shadow: inset 0 0 0 1px var(--line-strong); display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .2s; }
.mirror-generate:hover { color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(110,231,240,.4); }
.mirror-generate svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

.portrait-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
.portrait-section { padding: 16px; }
.portrait-section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.portrait-section-icon { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
.portrait-section-icon svg { width: 15px; height: 15px; stroke: #0B0E1A; fill: none; stroke-width: 2; }
.portrait-section-title { font-size: 14px; font-weight: 600; }
.portrait-text { font-size: 13.5px; line-height: 1.8; color: var(--text-mid); }
.portrait-evidence { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.portrait-evidence-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; color: var(--text-low); margin-bottom: 7px; }
.portrait-evidence-item { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--text-low); margin-bottom: 5px; }
.evidence-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); flex-shrink: 0; align-self: center; }
.evidence-date { font-family: var(--font-mono); font-size: 10.5px; color: var(--cyan); flex-shrink: 0; }
.mood-bar { display: flex; height: 9px; border-radius: 6px; overflow: hidden; gap: 2px; }
.mood-bar-seg { transition: width .6s ease; }
.mood-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 11px; }
.mood-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-mid); }
.mood-legend-dot { width: 7px; height: 7px; border-radius: 50%; }

.todo-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }

.snapshot-strip { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
.snapshot-chip { flex-shrink: 0; font-family: var(--font-mono); font-size: 10.5px; padding: 5px 11px; border-radius: var(--radius-full); box-shadow: inset 0 0 0 1px var(--line); color: var(--text-low); }

/* ============ 对话页 ============ */
.chat-wrap { display: flex; flex-direction: column; height: 100%; }
.chat-messages { flex: 1; overflow-y: auto; padding: 14px 4px 10px; }
.chat-msg { margin-bottom: 14px; display: flex; }
.chat-msg-user { justify-content: flex-end; }
.chat-msg-bubble { max-width: 84%; padding: 11px 15px; border-radius: 18px; font-size: 14.5px; line-height: 1.7; }
.chat-msg-user .chat-msg-bubble { background: var(--accent-grad); color: #0B0E1A; border-bottom-right-radius: 6px; font-weight: 500; }
.chat-msg-ai .chat-msg-bubble { background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); border-bottom-left-radius: 6px; backdrop-filter: blur(16px); }
.chat-route { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; color: var(--text-low); margin-bottom: 7px; }
.chat-route b { color: var(--cyan); font-weight: 500; }
.chat-msg-sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); }
.chat-source-link { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--cyan); padding: 3px 10px; border-radius: var(--radius-full); background: rgba(110,231,240,.08); box-shadow: inset 0 0 0 1px rgba(110,231,240,.22); }
.chat-source-link svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; }
.chat-input-bar { display: flex; gap: 10px; align-items: flex-end; padding: 10px 0 calc(4px); }
.chat-input { flex: 1; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); border: none; border-radius: 20px; padding: 11px 16px; font-size: 14.5px; resize: none; max-height: 110px; }
.chat-input:focus { outline: none; box-shadow: inset 0 0 0 1px rgba(110,231,240,.4); }
.chat-send { width: 42px; height: 42px; border-radius: 50%; background: var(--glass-2); box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; flex-shrink: 0; transition: all .2s; }
.chat-send svg { width: 17px; height: 17px; stroke: var(--text-low); fill: none; stroke-width: 2; }
.chat-send.enabled { background: var(--accent-grad); }
.chat-send.enabled svg { stroke: #0B0E1A; }
.typing-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--text-low); animation: blink 1.2s infinite; }
.typing-dots i:nth-child(2) { animation-delay: .2s; } .typing-dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 70%, 100% { opacity: .25; } 35% { opacity: 1; } }

/* ============ 日历 ============ */
.calendar-full { padding: 16px; }
.calendar-full-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.calendar-month { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.calendar-nav-btn { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line); }
.calendar-nav-btn svg { width: 15px; height: 15px; stroke: var(--text-mid); fill: none; stroke-width: 2; }
.calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-low); margin-bottom: 8px; }
.calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.calendar-day { position: relative; aspect-ratio: 1; display: grid; place-items: center; font-size: 13.5px; border-radius: 11px; color: var(--text-mid); transition: all .15s; }
.calendar-day.other-month { color: var(--text-low); opacity: .35; }
.calendar-day.has-record { color: var(--text-hi); font-weight: 500; }
.calendar-day.has-record::after { content: ""; position: absolute; bottom: 6px; width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--accent-grad); box-shadow: 0 0 6px rgba(110,231,240,.6); }
.calendar-day.today { box-shadow: inset 0 0 0 1.5px var(--cyan); }
.calendar-day.selected { background: var(--accent-grad); color: #0B0E1A; font-weight: 600; }
.calendar-day.selected::after { background: #0B0E1A; box-shadow: none; }
.calendar-legend { display: flex; gap: 16px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.calendar-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-low); }
.calendar-dot { width: 7px; height: 7px; border-radius: 50%; }
.calendar-dot.has-record { background: var(--accent-grad); }
.calendar-dot.today { box-shadow: inset 0 0 0 1.5px var(--cyan); background: transparent; }
.calendar-dot.selected { background: var(--accent-grad); }
.calendar-records { margin-top: 16px; }
.calendar-records-header { font-size: 13.5px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.calendar-records-count { font-family: var(--font-mono); font-size: 11px; color: var(--cyan); font-weight: 400; }
.calendar-record-item { padding: 13px 15px; margin-bottom: 8px; cursor: pointer; }
.calendar-record-title { font-size: 14px; font-weight: 600; }
.calendar-record-summary { font-size: 12.5px; color: var(--text-mid); margin: 2px 0 7px; }
.calendar-record-tags { display: flex; gap: 6px; flex-wrap: wrap; }

/* ============ 设置 ============ */
.settings-group { margin-bottom: 20px; }
.settings-group-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; color: var(--text-low); margin: 0 4px 8px; }
.settings-card { overflow: hidden; }
.settings-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border-bottom: 1px solid rgba(255,255,255,.045); }
.settings-item:last-child { border-bottom: none; }
.settings-item-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.settings-item-icon { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
.settings-item-icon svg { width: 15px; height: 15px; stroke: #0B0E1A; fill: none; stroke-width: 2; }
.settings-item-text { min-width: 0; }
.settings-item-label { font-size: 14px; }
.settings-item-desc { font-size: 12px; color: var(--text-low); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
.settings-chevron { width: 15px; height: 15px; stroke: var(--text-low); fill: none; stroke-width: 2; flex-shrink: 0; }
.toggle { width: 44px; height: 26px; border-radius: 999px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px var(--line); position: relative; transition: background .2s; flex-shrink: 0; cursor: pointer; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text-mid); transition: all .22s cubic-bezier(.34,1.4,.5,1); }
.toggle.on { background: var(--accent-grad); }
.toggle.on::after { left: 21px; background: #0B0E1A; }
.settings-note { font-size: 11.5px; color: var(--text-low); line-height: 1.6; padding: 10px 16px 14px; }
.settings-note.warn { color: var(--warn); }
.half-life-row { padding: 13px 16px; }
.half-life-value { font-family: var(--font-mono); font-size: 13px; color: var(--cyan); }
input[type="range"] { width: 100%; margin-top: 10px; accent-color: #A78BFA; background: transparent; }
.protocol-chips { display: flex; gap: 8px; padding: 4px 16px 14px; }
.settings-input { width: 100%; background: var(--glass); border: none; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--line); padding: 10px 13px; font-size: 13.5px; margin-top: 8px; }
.settings-input:focus { outline: none; box-shadow: inset 0 0 0 1px rgba(110,231,240,.4); }
.test-btn { font-size: 12.5px; color: var(--cyan); padding: 5px 13px; border-radius: var(--radius-full); box-shadow: inset 0 0 0 1px rgba(110,231,240,.35); flex-shrink: 0; }

/* ============ 每日总结 sheet ============ */
.sheet { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 110%); width: 100%; max-width: 640px; max-height: 78dvh; z-index: 45;
  background: rgba(19,23,44,.95); backdrop-filter: blur(28px); border-radius: 22px 22px 0 0; box-shadow: 0 -12px 48px rgba(0,0,0,.5), inset 0 1px 0 var(--line-strong); transition: transform .32s cubic-bezier(.32,.72,.28,1); display: flex; flex-direction: column; padding-bottom: var(--safe-bottom); }
.sheet.show { transform: translate(-50%, 0); }
.sheet-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 10px; }
.sheet-title { font-family: var(--font-display); font-size: 16px; }
.sheet-body { overflow-y: auto; padding: 6px 20px 22px; font-size: 14px; line-height: 1.85; color: var(--text-mid); }
.summary-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-low); margin-bottom: 12px; display: flex; gap: 14px; }
.summary-tag { display: inline-flex; font-size: 11px; color: var(--cyan); padding: 3px 10px; border-radius: var(--radius-full); box-shadow: inset 0 0 0 1px rgba(110,231,240,.25); margin-bottom: 12px; }

/* ============ Toast ============ */
.toast-container { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; width: max-content; max-width: 86vw; }
.toast { padding: 11px 18px; border-radius: 13px; background: rgba(25,30,56,.95); backdrop-filter: blur(20px); box-shadow: 0 6px 24px rgba(0,0,0,.4), inset 0 0 0 1px var(--line-strong); font-size: 13.5px; animation: toastIn .25s ease; text-align: center; }
.toast.success { box-shadow: 0 6px 24px rgba(0,0,0,.4), inset 0 0 0 1px rgba(74,222,156,.4); }
.toast.success::before { content: "✓ "; color: var(--success); }
.toast.error { box-shadow: 0 6px 24px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,107,129,.4); }
.toast.error::before { content: "✕ "; color: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* ============ 底部导航（移动） ============ */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-around; align-items: center;
  height: calc(var(--nav-height) + var(--safe-bottom)); padding-bottom: var(--safe-bottom);
  background: rgba(13,16,32,.88); backdrop-filter: blur(26px); border-top: 1px solid var(--line); }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-low); font-size: 10px; width: 56px; padding: 6px 0; transition: color .18s; }
.nav-item svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.nav-item.active { color: var(--cyan); }
.nav-item.active svg { filter: drop-shadow(0 0 6px rgba(110,231,240,.55)); }
.write-btn-circle { width: 46px; height: 46px; margin-top: -26px; border-radius: 50%; background: var(--accent-grad); display: grid; place-items: center; box-shadow: 0 6px 22px rgba(110,231,240,.35), 0 0 0 5px var(--ink); }
.write-btn-circle svg { width: 20px; height: 20px; stroke: #0B0E1A; stroke-width: 2.6; }

/* ============ 桌面适配 ============ */
@media (min-width: 900px) {

  .bottom-nav { display: none; }

  .page-header { display: flex; }

  .write-modal, .sheet { border-radius: 22px; bottom: 8dvh; }
  .write-modal.show { transform: translate(-50%, 0); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

    <button class="nav-item" data-page="chat"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>对话</span></button>
  </nav>

  <!-- ===== 写日记 ===== -->
  <div class="modal-overlay" id="write-overlay"></div>
  <div class="write-modal" id="write-modal">
    <div class="write-header">
      <button class="write-cancel" id="write-cancel">取消</button>
      <span class="write-header-title">写日记</span>
      <button class="write-submit" id="write-submit">保存</button>
    </div>
    <div class="write-body">
      <textarea class="write-textarea" id="write-textarea" placeholder="今天发生了什么？" maxlength="500"></textarea>
      <div class="write-footer">
        <span class="write-hint"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/></svg>可写多件事，AI 会自动拆分成片段</span>
        <span class="write-counter"><span id="write-count">0</span>/500</span>
      </div>
    </div>
  </div>

  <!-- ===== 每日总结 ===== -->
  <div class="modal-overlay" id="sheet-overlay"></div>
  <div class="sheet" id="summary-sheet">
    <div class="sheet-header">
      <span class="sheet-title">每日总结</span>
      <button class="write-cancel" id="sheet-close">关闭</button>
    </div>
    <div class="sheet-body" id="summary-body"></div>
  </div>

  <div class="toast-container" id="toast-container"></div>
</div>

<script>
/* ================= v2 数据模型：Record{content,status,chunks[]} / Chunk{segment,metadata} ================= */
const TYPE = { todo:'待办', note:'随记', thought:'感想', work:'工作', learning:'学习', social:'社交', plan:'计划', health:'健康', daily_summary:'日报' };
const MOOD = { happy:'开心', excited:'兴奋', satisfied:'满足', grateful:'感恩', expecting:'期待', calm:'平静', bored:'无聊', confused:'困惑', anxious:'焦虑', sad:'难过', angry:'愤怒', stressed:'压力', exhausted:'疲惫' };
const MOOD_COLOR = { happy:'#F7C948', excited:'#FF8FA3', satisfied:'#4ADE9C', grateful:'#7DD3FC', expecting:'#A78BFA', calm:'#6EE7F0', bored:'#94A3B8', confused:'#F0ABFC', anxious:'#FB923C', sad:'#60A5FA', angry:'#F87171', stressed:'#E879F9', exhausted:'#A3A3FB' };
const TASK = { not_started:'未开始', in_progress:'进行中', completed:'已完成' };

let nextId = 100;
const now = Date.now(), H = 3600000;
const md = (o) => o; // metadata helper
const store = {
  records: [
    { id:'1', status:'done', source:'user', content:'早上 6 点半起来跑了 5 公里，配速比上周快了 10 秒。下午学 Spring Security 的认证流程，JWT 过滤器那块卡了一会儿但搞懂了。晚上和小林吃饭，聊毕业设计，他建议前端用 Vue3 + TS。', created_at: now - 3*H, chunks: [
      { id:11, segment:'早上 6 点半起来跑了 5 公里，配速比上周快了 10 秒。', metadata: md({ title:'晨跑 5 公里', summary:'配速比上周提升 10 秒', contentType:'health', mood:['satisfied','exhausted'], keywords:['跑步','配速'] }) },
      { id:12, segment:'下午学 Spring Security 的认证流程，JWT 过滤器那块卡了一会儿但搞懂了。', metadata: md({ title:'学 Security 认证', summary:'JWT 过滤器已理解', contentType:'learning', mood:['calm','satisfied'], keywords:['Spring Security','JWT'] }) },
      { id:13, segment:'晚上和小林吃饭，聊毕业设计，他建议前端用 Vue3 + TS。', metadata: md({ title:'和小林吃饭', summary:'聊毕设，获前端选型建议', contentType:'social', mood:['happy'], keywords:['小林','毕设','Vue3'] }) },
    ]},
    { id:'2', status:'done', source:'user', content:'明天要开组会讲项目进度，PPT 还没做完，有点赶。', created_at: now - 27*H, chunks: [
      { id:21, segment:'明天要开组会讲项目进度，PPT 还没做完，有点赶。', metadata: md({ title:'组会演示准备', summary:'进度 PPT 未完成，时间紧', contentType:'todo', mood:['anxious','stressed'], keywords:['组会','PPT'], taskStatus:'in_progress' }) },
    ]},
    { id:'3', status:'done', source:'user', content:'看完《置身事内》第三章，理解了土地财政的逻辑，做了读书笔记。', created_at: now - 30*H, chunks: [
      { id:31, segment:'看完《置身事内》第三章，理解了土地财政的逻辑，做了读书笔记。', metadata: md({ title:'读《置身事内》', summary:'理解土地财政逻辑', contentType:'learning', mood:['satisfied'], keywords:['读书','经济'] }) },
    ]},
    { id:'4', status:'reviewing', source:'user', content:'中午和导师讨论了论文框架，他说实验部分要加对比组。下午有点累，趴了会儿。晚上打算把 Redis 的持久化看完。', created_at: now - 5*H, chunks: [
      { id:41, segment:'中午和导师讨论了论文框架，他说实验部分要加对比组。', metadata: md({ title:'和导师讨论', summary:'论文需补实验对比组', contentType:'work', mood:['calm'], keywords:['导师','论文'] }) },
      { id:42, segment:'下午有点累，趴了会儿。', metadata: md({ title:'午后小憩', summary:'疲惫，休息了一会儿', contentType:'health', mood:['exhausted'], keywords:['休息'] }) },
      { id:43, segment:'晚上打算把 Redis 的持久化看完。', metadata: md({ title:'计划读 Redis', summary:'晚上完成持久化章节', contentType:'plan', mood:['expecting'], keywords:['Redis','持久化'], taskStatus:'not_started' }) },
    ]},
    { id:'5', status:'failed', source:'user', fail_reason:'AI 判定内容无意义（skip=true）', content:'-test-', created_at: now - 2*H, chunks: [] },
  ],
  page: 'records',
  currentDetailId: null,
  calendarDate: new Date(),
  selectedCalendarDate: null,
  generating: false,
};

/* ================= utils ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function timeAgo(iso) { const diff = now - new Date(iso).getTime(); const m = Math.floor(diff/60000); if (m < 1) return '刚刚'; if (m < 60) return m+' 分钟前'; const h = Math.floor(m/60); if (h < 24) return h+' 小时前'; const d = Math.floor(h/24); if (d === 1) return '昨天'; return d+' 天前'; }
function dateKey(iso) { const d = new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateLabel(iso) { const d = new Date(iso); return (d.getMonth()+1)+' 月 '+d.getDate()+' 日'; }
function toast(msg, kind) { const t = document.createElement('div'); t.className = 'toast ' + (kind||''); t.textContent = msg; $('toast-container').appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(), 300); }, 2400); }
function moodChipsHtml(moods, cls) { return (moods||[]).map(m => '<span class="tag '+ (cls||'') +'"><span class="dot" style="background:'+(MOOD_COLOR[m]||'#999')+'"></span>'+(MOOD[m]||m)+'</span>').join(''); }
function typeChip(t) { return '<span class="tag tag-type">'+(TYPE[t]||t)+'</span>'; }

/* ================= 页面切换 ================= */
const PAGE_TITLES = { records:'记录', calendar:'日历', mirror:'镜子', chat:'对话', settings:'设置' };
function switchPage(page) {
  store.page = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $('page-'+page).classList.add('active');
  document.querySelectorAll('.nav-item, .sidebar-nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  $('mobile-title').textContent = PAGE_TITLES[page] || '';
  if (page === 'calendar') renderCalendar();
}
document.body.addEventListener('click', e => {
  const pageBtn = e.target.closest('[data-page]');
  const actBtn = e.target.closest('[data-action]');
  if (actBtn) { const a = actBtn.dataset.action; if (a==='write') openWrite(); if (a==='summary') openSummary(); return; }
  if (pageBtn) switchPage(pageBtn.dataset.page);
});

/* ================= 记录列表 ================= */
function recordCardHtml(r) {
  const isActive = store.currentDetailId === r.id;
  let inner = '', cls = 'record-card card ' + r.status + (isActive?' active':'');
  if (r.status === 'processing') {
    inner = '<div class="record-meta"><span class="record-time">'+timeAgo(r.created_at)+'</span><span class="tag tag-processing"><span class="spinner"></span>AI 整理中</span></div><div class="record-summary">'+esc(r.content.slice(0,40))+'…</div>';
  } else if (r.status === 'failed') {
    inner = '<div class="record-meta"><span class="record-time">'+timeAgo(r.created_at)+'</span><span class="tag" style="color:var(--danger);box-shadow:inset 0 0 0 1px rgba(255,107,129,.35)">失败</span></div><div class="record-summary">'+esc(r.content)+'</div><div class="status-failed-row"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>'+esc(r.fail_reason||'处理失败')+'</div><div style="display:flex;gap:8px;margin-top:10px"><button class="chip" data-rec="'+r.id+'" data-op="retry" style="color:var(--cyan)">重试</button><button class="chip" data-rec="'+r.id+'" data-op="del" style="color:var(--danger)">删除</button></div>';
  } else {
    const c0 = r.chunks[0], multi = r.chunks.length > 1;
    const m0 = c0.metadata;
    const title = multi ? c0.metadata.title + ' 等 ' + r.chunks.length + ' 件事' : m0.title;
    const types = [...new Set(r.chunks.map(c=>c.metadata.contentType))];
    inner = '<div class="record-meta"><span class="record-time">'+timeAgo(r.created_at)+'</span><div class="record-tags">'+types.map(typeChip).join('')+(r.status==='reviewing'?'<span class="tag tag-processing">待审核</span>':'')+moodChipsHtml((m0.mood||[]).slice(0,2))+'</div></div>'
      + '<div class="record-title">'+esc(title)+'</div>'
      + '<div class="record-summary">'+esc(m0.summary)+'</div>'
      + '<div class="record-keywords">'+(m0.keywords||[]).map(k=>'<span class="keyword">'+esc(k)+'</span>').join('')+'</div>'
      + '<div class="record-footer">'+(multi?'<span class="chunk-count"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>'+r.chunks.length+' 个片段</span>':'<span></span>')+(r.status==='reviewing'?'<span></span>':'')+'</div>';
  }
  return '<div class="'+cls+'" data-rec="'+r.id+'" data-op="open">'+inner+'</div>';
}
function renderRecords() {
  const userRecords = store.records.filter(r => r.source !== 'system');
  const done = $('records-content');
  if (!userRecords.length) { done.innerHTML = '<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><div class="empty-title">还没有记录</div><div class="empty-desc">点下方 ✎，随手记点什么</div></div>'; $('records-count').textContent=''; return; }
  $('records-count').textContent = userRecords.length + ' 条记录 · 今天 ' + userRecords.filter(r=>dateKey(r.created_at)===dateKey(new Date())).length + ' 条';
  const groups = {};
  userRecords.forEach(r => { (groups[dateKey(r.created_at)] ||= []).push(r); });
  let html = '';
  Object.keys(groups).sort().reverse().forEach(k => {
    html += '<div class="date-separator">'+dateLabel(groups[k][0].created_at)+'</div>';
    html += groups[k].map(recordCardHtml).join('');
  });
  done.innerHTML = html;
}
document.body.addEventListener('click', e => {
  const btn = e.target.closest('[data-rec]');
  if (!btn) return;
  const id = btn.dataset.rec, op = btn.dataset.op;
  if (op === 'open') openDetail(id);
  if (op === 'retry') { const r = store.records.find(x=>x.id===id); if (r) { r.status='processing'; r.fail_reason=null; renderRecords(); toast('已重新提交，AI 处理中…'); setTimeout(()=>{ r.status='reviewing'; r.chunks = mockChunks('重试成功的新内容，AI 重新拆分了一件事。'); renderRecords(); toast('处理完成，待审核','success'); }, 2600); } }
  if (op === 'del') { store.records = store.records.filter(x=>x.id!==id); renderRecords(); renderCalendar(); toast('记录已删除'); }
});

/* ================= 详情 / 审核 ================= */
function openDetail(id) {
  store.currentDetailId = id;
  const r = store.records.find(x=>x.id===id); if (!r) return;
  $('detail-page').classList.add('show');
  if (r.status === 'processing') renderProcessing(r); else renderReview(r);
}
function closeDetail() { $('detail-page').classList.remove('show'); store.currentDetailId = null; }
$('detail-back').addEventListener('click', closeDetail);

function renderProcessing(r) {
  $('detail-header-title').textContent = 'AI 整理中';
  $('detail-confirm').classList.remove('show');
  $('detail-content').innerHTML = '<div class="processing-view"><div class="processing-ring"></div><div class="processing-title">正在分析你的记录</div><div class="processing-desc">Clean → Classify → 生成片段</div><div class="processing-steps">'
    + '<div class="processing-step active" id="st1"><div class="processing-step-dot"></div>文本清洗（Clean）</div>'
    + '<div class="processing-step" id="st2"><div class="processing-step-dot"></div>拆分与分类（Classify）</div>'
    + '<div class="processing-step" id="st3"><div class="processing-step-dot"></div>生成片段卡片</div></div></div>';
  setTimeout(()=>{ const s=$('st1'); if(s){s.classList.remove('active');s.classList.add('done');$('st2').classList.add('active');} }, 700);
  setTimeout(()=>{ const s=$('st2'); if(s){s.classList.remove('active');s.classList.add('done');$('st3').classList.add('active');} }, 1400);
  setTimeout(()=>{ if (store.currentDetailId === r.id && r.status === 'processing') { r.status='reviewing'; r.chunks = mockChunks(r.content); renderRecords(); renderCalendar(); renderReview(r); toast('AI 拆分完成，请审核','success'); } }, 2100);
}

function mockChunks(content) {
  const parts = content.split(/[。；;]+/).map(s=>s.trim()).filter(s=>s.length>3);
  const pool = [
    { contentType:'learning', mood:['calm','satisfied'], keywords:['学习'] },
    { contentType:'work', mood:['stressed'], keywords:['工作','项目'], taskStatus:'in_progress' },
    { contentType:'social', mood:['happy'], keywords:['朋友'] },
    { contentType:'todo', mood:['anxious'], keywords:['计划'], taskStatus:'not_started' },
    { contentType:'note', mood:['calm'], keywords:['随记'] },
  ];
  return (parts.length ? parts : [content]).map((p, i) => ({
    id: nextId++, segment: p,
    metadata: { title: p.slice(0, 8), summary: p.slice(0, 18), ...(pool[i % pool.length]) },
  }));
}

function renderReview(r) {
  const editable = r.status === 'reviewing';
  $('detail-header-title').textContent = r.status === 'done' ? '记录详情（只读）' : '审核 · ' + r.chunks.length + ' 个片段';
  $('detail-confirm').classList.toggle('show', editable);
  let html = '<div class="review-original"><div class="review-label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>原始内容 · 不可修改</div><div class="review-original-text">'+esc(r.content)+'</div></div>';
  html += '<div class="review-list-label"><span>片段卡片 · CHUNKS</span><span>'+r.chunks.length+'</span></div>';
  r.chunks.forEach((c, i) => { html += chunkCardHtml(c, i, editable); });
  if (editable) {
    html += '<button class="add-chunk-btn" id="add-chunk"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新增片段（AI 自动单段分类）</button>';
    html += '<div class="review-hint"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/></svg>合并：把 A 的文本改成合并内容，再删掉 B。拆分：把 A 改成前半句，再点「新增片段」补后半。改动文本的片段会在确认时自动重新分类。</div>';
  }
  $('detail-content').innerHTML = html;
  if (editable) {
    $('detail-content').querySelectorAll('.chunk-segment').forEach(t => t.addEventListener('input', () => { const c = findChunk(t.dataset.chunk); if (c) { c.segment = t.value; c._textEdited = true; } autoGrow(t); }));
    $('add-chunk').addEventListener('click', addChunk);
  }
}
function findChunk(cid) { const r = store.records.find(x=>x.id===store.currentDetailId); return r && r.chunks.find(c=>String(c.id)===String(cid)); }
function autoGrow(t) { t.style.height='auto'; t.style.height = t.scrollHeight+'px'; }

function chunkCardHtml(c, i, editable) {
  const m = c.metadata || {};
  const segHtml = editable
    ? '<textarea class="chunk-segment" data-chunk="'+c.id+'" rows="1">'+esc(c.segment)+'</textarea>'
    : '<div class="chunk-segment" style="padding:0">'+esc(c.segment)+'</div>';
  const typeChips = Object.keys(TYPE).filter(t=>t!=='daily_summary').map(t => '<button class="chip type-chip '+(m.contentType===t?'selected':'')+'" data-chunk="'+c.id+'" data-op="type" data-val="'+t+'">'+TYPE[t]+'</button>').join('');
  const moodChips = Object.keys(MOOD).map(mo => '<button class="chip mood-chip '+((m.mood||[]).includes(mo)?'selected':'')+'" style="color:'+(MOOD_COLOR[mo])+'" data-chunk="'+c.id+'" data-op="mood" data-val="'+mo+'"><span class="dot"></span>'+MOOD[mo]+'</button>').join('');
  const taskHtml = (m.contentType==='todo'||m.contentType==='plan') ? '<div class="chunk-field"><div class="chunk-field-label">任务状态 TASK</div><div class="chip-row">'+Object.keys(TASK).map(t=>'<button class="chip '+(m.taskStatus===t?'selected':'')+'" data-chunk="'+c.id+'" data-op="task" data-val="'+t+'">'+TASK[t]+'</button>').join('')+'</div></div>' : '';
  const delBtn = editable ? '<button class="chunk-icon-btn danger" data-chunk="'+c.id+'" data-op="delchunk" title="删除片段"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>' : '';
  return '<div class="chunk-card card"><div class="chunk-top"><span class="chunk-index">#'+String(i+1).padStart(2,'0')+(c._textEdited?' · 已改文本':'')+'</span><div class="chunk-actions">'+delBtn+'</div></div>'
    + segHtml
    + '<div class="chunk-field"><div class="chunk-field-label">标题 / 摘要</div><div style="font-size:13.5px;font-weight:600">'+esc(m.title||'（待分类）')+'</div><div style="font-size:12.5px;color:var(--text-mid)">'+esc(m.summary||'确认时 AI 将自动补分类')+'</div></div>'
    + '<div class="chunk-field"><div class="chunk-field-label">内容类型 TYPE · 8 选 1</div><div class="chip-row">'+typeChips+'</div></div>'
    + '<div class="chunk-field"><div class="chunk-field-label">情绪 MOOD · 多选</div><div class="chip-row">'+moodChips+'</div></div>'
    + taskHtml
    + '<div class="chunk-field"><div class="chunk-field-label">关键词 KEYWORDS · 3-5 个</div>'+(editable?'<input class="keywords-input" data-chunk="'+c.id+'" data-op="kw" value="'+esc((m.keywords||[]).join('，'))+'" placeholder="用逗号分隔">':'<div class="record-keywords" style="margin-top:0">'+(m.keywords||[]).map(k=>'<span class="keyword">'+esc(k)+'</span>').join('')+'</div>')+'</div></div>';
}

document.body.addEventListener('click', e => {
  const chip = e.target.closest('[data-op]');
  if (!chip || chip.dataset.op === 'open' || chip.dataset.op === 'retry' || chip.dataset.op === 'del') return;
  const cid = chip.dataset.chunk, op = chip.dataset.op, val = chip.dataset.val;
  const r = store.records.find(x=>x.id===store.currentDetailId); if (!r) return;
  const c = r.chunks.find(x=>String(x.id)===String(cid)); if (!c) return;
  if (op === 'type') { c.metadata.contentType = val; c.metadata.taskStatus = undefined; c._metaEdited = true; }
  if (op === 'mood') { const arr = c.metadata.mood ||= []; const i = arr.indexOf(val); i>=0 ? arr.splice(i,1) : arr.push(val); c._metaEdited = true; }
  if (op === 'task') { c.metadata.taskStatus = c.metadata.taskStatus===val ? undefined : val; c._metaEdited = true; }
  if (op === 'delchunk') { r.chunks = r.chunks.filter(x=>x!==c); toast('片段已删除'); }
  renderReview(r);
});
document.body.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.op === 'kw') { const c = findChunk(e.target.dataset.chunk); if (c) { c.metadata.keywords = e.target.value.split(/[，,]/).map(s=>s.trim()).filter(Boolean); c._metaEdited = true; } } });

function addChunk() {
  const r = store.records.find(x=>x.id===store.currentDetailId); if (!r) return;
  const c = { id: nextId++, segment: '', metadata: {}, _textEdited: true };
  r.chunks.push(c);
  renderReview(r);
  const t = document.querySelector('.chunk-segment[data-chunk="'+c.id+'"]');
  if (t) { t.focus(); t.placeholder = '写下新片段…（保存后 AI 自动单段分类）'; }
  toast('已新增片段，输入文本后 AI 将自动分类');
}

$('detail-confirm').addEventListener('click', () => {
  const r = store.records.find(x=>x.id===store.currentDetailId); if (!r) return;
  const btn = $('detail-confirm'); btn.disabled = true; btn.textContent = '补分类 → 向量化…';

function renderCalendar() {
  const y = store.calendarDate.getFullYear(), m = store.calendarDate.getMonth();
  const today = new Date();
  const first = new Date(y, m, 1).getDay(), dim = new Date(y, m+1, 0).getDate(), prevDim = new Date(y, m, 0).getDate();
  const withRec = new Set(store.records.filter(r=>r.source!=='system').map(r=>dateKey(r.created_at)));
  let html = '';
  for (let i = first-1; i >= 0; i--) html += '<div class="calendar-day other-month">'+(prevDim-i)+'</div>';
  for (let d = 1; d <= dim; d++) {
    const key = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===d;
    const sel = store.selectedCalendarDate && dateKey(store.selectedCalendarDate)===key;
    html += '<div class="calendar-day'+(withRec.has(key)?' has-record':'')+(isToday?' today':'')+(sel?' selected':'')+'" data-day="'+key+'">'+d+'</div>';
  }
  const rest = (first+dim)%7; if (rest) for (let i=1;i<=7-rest;i++) html += '<div class="calendar-day other-month">'+i+'</div>';
  $('calendar-month').textContent = y+' 年 '+(m+1)+' 月';
  $('calendar-days').innerHTML = html;
}

function handleChat() {
  if (chatBusy) return;

      const bubble = aiEl.querySelector('.chat-msg-bubble');

      bubble.innerHTML = '<div class="chat-route">INTENT → <b>'+hit.route+'</b></div>'; bubble.appendChild(typed);
      const timer = setInterval(() => {
        i += 2; typed.textContent = hit.answer.slice(0, i);

          chatBusy = false;
        }
      }, 28);
    }, 900);
  }, 250);
}

      <div class="settings-item"><div class="settings-item-left"><div class="settings-item-icon" style="background:rgba(255,107,129,.8)"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></div><div class="settings-item-text"><div class="settings-item-label">退出登录</div></div></div><button class="test-btn" data-op="logout" style="color:var(--danger);box-shadow:inset 0 0 0 1px rgba(255,107,129,.35)">退出</button></div>
    </div>
  </div>`;
}
document.body.addEventListener('click', e => {
  const t = e.target.closest('[data-op="auto"], [data-op="embed-src"]');
  if (t) { t.classList.toggle('on'); if (t.dataset.op==='auto' && t.classList.contains('on')) toast('已开启 auto：新记录将跳过审核直接入库'); return; }
  const b = e.target.closest('.test-btn');
  if (b) { const op = b.dataset.op;
    if (op==='test-ai') toast('连接成功 · claude-sonnet-5','success');
    if (op==='export') toast('导出完成（原型模拟）','success');
    if (op==='logout') toast('已退出（原型模拟）'); }
});
document.body.addEventListener('input', e => {
  if (e.target.id === 'hl-slider') { const v = e.target.value; $('hl-value').textContent = v+' 天'; $('hl-preview').textContent = 'final_score = 相似度 × 1/(1 + 天数差/'+v+')'; }
});

/* ================= 每日总结 ================= */
function openSummary() {
  $('sheet-overlay').classList.add('show'); $('summary-sheet').classList.add('show');
  $('summary-body').innerHTML = '<div class="summary-tag">系统记录 · source=system</div><div class="summary-meta"><span>2026-09-02</span><span>记录 4 条</span><span>23:41 生成</span></div>昨天是高效的一天：上午完成数据库概念设计（工作·开心），下午学 Spring Security 认证流程并搞懂了 JWT 过滤器（学习·平静），晚上和小林吃饭聊毕设选型（社交·开心）。全天情绪积极，唯一挂起事项是组会演示 PPT。夜里有拖延倾向——23 点后才开始整理笔记，建议把深度学习任务放早上。';
}
function closeSummary() { $('sheet-overlay').classList.remove('show'); $('summary-sheet').classList.remove('show'); }
$('sheet-close').addEventListener('click', closeSummary);
$('sheet-overlay').addEventListener('click', closeSummary);

/* ================= init ================= */
renderRecords(); renderCalendar(); renderCalendarRecords(); renderMirror(); renderSettings();
</script>
