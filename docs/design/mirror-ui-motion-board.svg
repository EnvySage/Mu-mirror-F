  <linearGradient id="glass"><stop stop-color="#1762ff" stop-opacity=".65"/><stop offset="1" stop-color="#50edfa" stop-opacity=".06"/></linearGradient>
  <pattern id="grain" width="140" height="80" patternUnits="userSpaceOnUse"><path d="M-20 50Q35 5 95 32T180 10" fill="none" stroke="#50edfa" stroke-opacity=".09" stroke-width="8"/></pattern>
  <style>
