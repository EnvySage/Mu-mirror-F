<text x="54" y="70" class="display" font-size="44">MIRROR / BLUE HOUR</text>
<text x="55" y="118" font-size="27" font-weight="700">让记忆展开，让每次操作接得上。</text>
<text x="55" y="152" class="note">三页布局与动效分镜 · 示例内容 · 2026.10.17 · 供设计审阅与 Luna 实现对照</text>
<text x="1835" y="67" text-anchor="end" class="display cyan" font-size="55">3 VIEWS</text>
<text x="54" y="237" class="display cyan" font-size="24">A  RECORDS</text><text x="54" y="270" class="label" >记录流：日期有节奏，正文有主次</text><rect x="54" y="292" width="584" height="426" fill="url(#sea)" stroke="#24477b" /><rect x="54" y="292" width="584" height="426" fill="url(#grain)" /><text x="74" y="328" class="display" font-size="27">DAILY RECORDS</text><rect x="454" y="306" width="163" height="32" fill="#50edfa" /><text x="471" y="328" class="ink small" font-weight="700">＋ 写下此刻</text><text x="75" y="371" class="display cyan" font-size="43">17</text><text x="75" y="394" class="display muted" font-size="18">OCT</text><path d="M130 355V682" stroke="#50edfa" stroke-opacity=".45"/><path d="M148 355H425L457 387V485H148Z" fill="#50edfa" fill-opacity=".55" transform="translate(7 6)"/><path d="M148 355H425L457 387V485H148Z" fill="#f8fbff"/><rect x="148" y="355" width="4" height="130" fill="#50edfa" /><text x="165" y="383" class="ink" font-size="19" font-weight="700">今天，用 GPT 改了前端</text><text x="165" y="414" class="ink small" >终于把想法做成了能用的页面。</text><text x="165" y="442" class="ink small" >学习   ·   开心</text><text x="165" y="469" class="small" fill="#405779">21:30        2 个片段</text><rect x="473" y="355" width="145" height="298" fill="#071a48" stroke="#254774" /><text x="487" y="384" class="small" font-weight="700">今日概览</text><text x="487" y="414" class="small muted" >最近的记录</text><path d="M487 431H603" fill="none" stroke="#315485"/><text x="487" y="462" class="small" font-weight="700">每日总结</text><text x="487" y="491" class="small muted" >继续阅读</text><path d="M487 509H603" fill="none" stroke="#315485"/><text x="487" y="540" class="small" font-weight="700">最近情绪</text><circle cx="494" cy="565" r="5" fill="#50edfa"/><circle cx="518" cy="565" r="5" fill="#e3ad21"/><text x="165" y="524" class="body" font-weight="700">练习吉他</text><text x="165" y="554" class="small muted" >把难的和弦，又练顺了一点。</text><path d="M160 505H430L456 531V652H174L160 638Z" fill="#ee246a" fill-opacity=".42" transform="translate(5 5)"/><path d="M160 505H430L456 531V652H174L160 638Z" fill="#0b255c" stroke="#50edfa" stroke-opacity=".45"/><path d="M148 579H456" fill="none" stroke="#315485"/><text x="165" y="612" class="body" font-weight="700">接下来想做的事</text><text x="165" y="642" class="small muted" >给明天留一个清楚的小目标。</text><text x="75" y="684" class="display muted" font-size="32">16</text><text x="165" y="687" class="small muted" >前一天的记录</text><text x="54" y="752" class="note" >斜线日期轨道＋首位主卡＋余卡按序交错错位（不随机）</text><text x="668" y="237" class="display cyan" font-size="24">B  MEMORY</text><text x="668" y="270" class="label" >记忆详情：正文展开，属性随后落定</text><rect x="668" y="292" width="584" height="426" fill="url(#sea)" stroke="#24477b" /><rect x="668" y="292" width="584" height="426" fill="url(#grain)" /><text x="688" y="325" class="small cyan" >‹ 返回</text><text x="1072" y="325" class="small cyan" font-weight="700">保存授权</text><text x="690" y="392" class="display cyan" font-size="63">16</text><text x="692" y="418" class="display muted" font-size="21">OCT</text><path d="M746 361V657" stroke="#385c8b"/><text x="694" y="476" class="display cyan" font-size="24">01</text><text x="694" y="521" class="display muted" font-size="24">02</text><rect x="765" y="354" width="293" height="310" fill="#f8fbff" /><rect x="765" y="354" width="5" height="310" fill="#50edfa" /><text x="785" y="388" class="ink" font-size="24" font-weight="800">GPT 改前端</text><text x="785" y="416" class="small" fill="#566c8d">原文  /  片段 01</text><text x="785" y="462" class="ink small" >今天把页面重新整理了一遍。</text><text x="785" y="493" class="ink small" >导航很有感觉，但记录区域</text><text x="785" y="524" class="ink small" >还可以有更好的阅读节奏。</text><path d="M785 551H1039" fill="none" stroke="#c9d7e9"/><text x="785" y="581" class="small" fill="#566c8d">摘要</text><text x="785" y="611" class="ink small" >一次关于界面和交互的改进。</text><rect x="1074" y="354" width="158" height="310" fill="#081d4b" stroke="#33577f" /><text x="1089" y="386" class="small" font-weight="700">片段属性</text><rect x="1089" y="406" width="59" height="27" fill="#50edfa" /><text x="1102" y="425" class="ink small" >学习</text><text x="1089" y="471" class="small cyan" >● 开心</text><text x="1089" y="505" class="small muted" >GPT · 前端</text><path d="M1089 527H1218" fill="none" stroke="#315485"/><text x="1089" y="562" class="small" font-weight="700">☑ 加入记忆</text><text x="1089" y="593" class="small cyan" >未保存</text><text x="785" y="694" class="small muted" >原文、阅读与授权，保持清楚的边界。</text><text x="668" y="752" class="note" >来源卡片展开 → 正文可读 → 属性落定 → 原路收回。</text><text x="1282" y="237" class="display cyan" font-size="24">C  ARCHIVE</text><text x="1282" y="270" class="label" >资产库：文件有身份，可以抽出与放回</text><rect x="1282" y="292" width="584" height="426" fill="url(#sea)" stroke="#24477b" /><rect x="1282" y="292" width="584" height="426" fill="url(#grain)" /><text x="1302" y="328" class="display" font-size="27">ARCHIVE</text><text x="1700" y="325" class="small muted" >存储空间</text><rect x="1302" y="347" width="544" height="67" fill="url(#glass)" stroke="#50edfa" /><text x="1320" y="376" class="body" font-weight="700">＋ 把灵感放进来</text><text x="1320" y="400" class="small muted" >拖入文件，填写信息后收好。</text><text x="1303" y="448" class="small cyan" >全部    文档    图片    音频</text><path d="M1302 469H1440L1466 495V654H1302Z" fill="#50edfa" fill-opacity=".65" transform="translate(5 5)"/><path d="M1302 469H1440L1466 495V654H1302Z" fill="#f8fbff"/><rect x="1302" y="469" width="164" height="61" fill="#dce9ff" /><text x="1317" y="509" class="display ink" font-size="34">MD</text><path d="M1443 469L1466 492V469Z" fill="#50edfa"/><text x="1314" y="559" class="ink small" font-weight="700">项目设计文档</text><text x="1314" y="588" class="small" fill="#405779">方案和交互说明</text><text x="1314" y="619" class="small" fill="#14785c">● 已可检索</text><text x="1314" y="642" class="small" fill="#405779">预览   编辑   下载</text><path d="M1508 469H1649V628L1623 654H1485V492Z" fill="#f8fbff"/><rect x="1485" y="469" width="164" height="61" fill="#174bb7" /><text x="1500" y="509" class="display cyan" font-size="34">JPG</text><path d="M1626 469L1649 492V469Z" fill="#50edfa"/><text x="1497" y="559" class="ink small" font-weight="700">表情素材</text><text x="1497" y="588" class="small" fill="#405779">留住一个好玩的点子</text><text x="1497" y="619" class="small" fill="#14785c">● 已可检索</text><text x="1497" y="642" class="small" fill="#405779">预览   编辑   下载</text><path d="M1668 469H1832V630H1689L1668 609Z" fill="#f8fbff"/><rect x="1668" y="469" width="164" height="61" fill="#dce9ff" /><text x="1683" y="509" class="display ink" font-size="34">PDF</text><path d="M1809 469L1832 492V469Z" fill="#50edfa"/><text x="1680" y="559" class="ink small" font-weight="700">阅读资料</text><text x="1680" y="588" class="small" fill="#405779">后续可以继续翻看</text><text x="1680" y="619" class="small" fill="#14785c">● 已可检索</text><text x="1680" y="642" class="small" fill="#405779">预览   编辑   下载</text><text x="1303" y="692" class="small muted" >未确认文件保留独立入口与真实状态。</text><text x="1282" y="752" class="note" >文件架高低错落；投放槽展开、封套斜切入架，再抽出预览。</text><path d="M54 801H1866" stroke="#24477b"/><text x="54" y="848" class="label" >一条动作链，看清发生了什么</text><text x="1866" y="848" class="note" text-anchor="end">示例：打开记录 540ms / 返回 360ms</text><rect x="54" y="875" width="267" height="178" fill="#091d4e" stroke="#25487b" /><path d="M68 895H307" stroke="#345d91"/><rect x="78" y="912" width="218" height="45" fill="#f8fbff" /><rect x="78" y="912" width="4" height="45" fill="#50edfa" /><rect x="94" y="925" width="139" height="5" fill="#173768" /><rect x="94" y="940" width="177" height="4" fill="#9ab2d3" /><rect x="78" y="972" width="218" height="27" fill="#11336f" /><rect x="78" y="1010" width="218" height="22" fill="#11336f" /><path d="M247 948l8 22 5-9 10-4Z" fill="#50edfa" stroke="#071333"/><text x="54" y="1085" class="label" >点击来源</text><text x="54" y="1116" class="note" >0–100ms</text><text x="334" y="976" class="cyan" font-size="30">›</text><rect x="363" y="875" width="267" height="178" fill="#091d4e" stroke="#25487b" /><path d="M377 895H616" stroke="#345d91"/><rect x="398" y="910" width="192" height="121" fill="#f8fbff" /><rect x="398" y="910" width="4" height="121" fill="#50edfa" /><text x="363" y="1085" class="label" >外形展开</text><text x="363" y="1116" class="note" >60–360ms</text><text x="643" y="976" class="cyan" font-size="30">›</text><rect x="672" y="875" width="267" height="178" fill="#091d4e" stroke="#25487b" /><path d="M686 895H925" stroke="#345d91"/><rect x="696" y="910" width="155" height="121" fill="#f8fbff" /><rect x="696" y="910" width="4" height="121" fill="#50edfa" /><rect x="712" y="928" width="115" height="7" fill="#173768" /><rect x="712" y="951" width="112" height="4" fill="#9ab2d3" /><rect x="712" y="966" width="92" height="4" fill="#9ab2d3" /><rect x="712" y="981" width="112" height="4" fill="#9ab2d3" /><rect x="712" y="996" width="92" height="4" fill="#9ab2d3" /><text x="672" y="1085" class="label" >正文进入</text><text x="672" y="1116" class="note" >220–440ms</text><text x="952" y="976" class="cyan" font-size="30">›</text><rect x="981" y="875" width="267" height="178" fill="#091d4e" stroke="#25487b" /><path d="M995 895H1234" stroke="#345d91"/><rect x="1005" y="910" width="155" height="121" fill="#f8fbff" /><rect x="1005" y="910" width="4" height="121" fill="#50edfa" /><rect x="1021" y="928" width="115" height="7" fill="#173768" /><rect x="1021" y="951" width="112" height="4" fill="#9ab2d3" /><rect x="1021" y="966" width="92" height="4" fill="#9ab2d3" /><rect x="1021" y="981" width="112" height="4" fill="#9ab2d3" /><rect x="1021" y="996" width="92" height="4" fill="#9ab2d3" /><rect x="1171" y="910" width="55" height="121" fill="#103b82" /><rect x="1180" y="928" width="35" height="14" fill="#50edfa" /><rect x="1180" y="955" width="31" height="4" fill="#adc9ee" /><rect x="1180" y="973" width="31" height="4" fill="#adc9ee" /><text x="981" y="1085" class="label" >属性落定</text><text x="981" y="1116" class="note" >360–540ms</text><text x="1261" y="976" class="cyan" font-size="30">›</text><rect x="1290" y="875" width="267" height="178" fill="#091d4e" stroke="#25487b" /><path d="M1304 895H1543" stroke="#345d91"/><rect x="1314" y="910" width="155" height="121" fill="#f8fbff" /><rect x="1314" y="910" width="4" height="121" fill="#50edfa" /><rect x="1330" y="928" width="115" height="7" fill="#173768" /><rect x="1330" y="951" width="112" height="4" fill="#9ab2d3" /><rect x="1330" y="966" width="92" height="4" fill="#9ab2d3" /><rect x="1330" y="981" width="112" height="4" fill="#9ab2d3" /><rect x="1330" y="996" width="92" height="4" fill="#9ab2d3" /><rect x="1480" y="910" width="55" height="121" fill="#103b82" /><rect x="1489" y="928" width="35" height="14" fill="#50edfa" /><rect x="1489" y="955" width="31" height="4" fill="#adc9ee" /><rect x="1489" y="973" width="31" height="4" fill="#adc9ee" /><text x="1290" y="1085" class="label" >阅读与编辑</text><text x="1290" y="1116" class="note" >按真实操作</text><text x="1570" y="976" class="cyan" font-size="30">›</text><rect x="1599" y="875" width="267" height="178" fill="#091d4e" stroke="#25487b" /><path d="M1613 895H1852" stroke="#345d91"/><rect x="1623" y="912" width="218" height="45" fill="#f8fbff" /><rect x="1623" y="912" width="4" height="45" fill="#50edfa" /><rect x="1639" y="925" width="139" height="5" fill="#173768" /><rect x="1639" y="940" width="177" height="4" fill="#9ab2d3" /><rect x="1623" y="972" width="218" height="27" fill="#11336f" /><rect x="1623" y="1010" width="218" height="22" fill="#11336f" /><text x="1599" y="1085" class="label" >收回来源</text><text x="1599" y="1116" class="note" >返回约 360ms</text><rect x="54" y="1153" width="1812" height="64" fill="#092456" /><text x="77" y="1193" class="body" >主转场有气势，局部操作有回应；文字不晃，保存不假报，返回不迷路。</text><text x="1835" y="1193" class="small muted" text-anchor="end">布局与分镜示意</text></svg>
