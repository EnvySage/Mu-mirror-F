name: Deploy Mu-mirror

on:
  push:
    branches: [main]            # 推送到 main 触发构建
  workflow_dispatch:

permissions:
  contents: write               # 需要创建 Release 上传构建产物

concurrency:
  group: deploy-mu-mirror
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'    # 项目要求 ^22.18.0 || >=24.12.0
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 打包 dist
        run: tar -czf mu-mirror-dist.tar.gz -C dist .

      - name: 发布构建产物到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 自动生成，无需手动配置
        run: |
          gh release create deploy \
            --title "auto-deploy" \
            --notes "auto build ${GITHUB_SHA}" \
            --target main 2>/dev/null || true
          gh release upload deploy mu-mirror-dist.tar.gz --clobber

      - name: 通知服务器立即部署
        continue-on-error: true    # 通知失败不影响构建结果，兜底靠每小时轮询
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 25 -X POST \
              -H "X-Token: ${{ secrets.DEPLOY_HOOK_TOKEN }}" \
              http://112.74.94.42:8899/hook)
            echo "第 $i 次通知: HTTP $code"
            if [ "$code" = "202" ]; then
              echo "服务器已收到通知，正在部署"
              exit 0
            fi
            sleep 15
          done
          echo "⚠️ 通知失败（国际链路抖动），服务器将在每小时轮询时自动部署"
