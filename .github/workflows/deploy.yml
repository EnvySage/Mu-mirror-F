name: Deploy Mu-mirror

on:
  push:
    branches: [main]            # 推送到 main 触发部署
  workflow_dispatch:            # 支持手动触发 / 回滚
    inputs:
      action:
        description: 'deploy（默认）或 rollback'
        required: false
        default: 'deploy'

permissions:
  contents: read                # 最小权限

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------- 回滚分支 ----------
      - name: 回滚到上一个版本
        if: github.event.inputs.action == 'rollback'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: sudo /usr/local/bin/deploy-mirror.sh rollback

      # ---------- 正常部署分支 ----------
      - uses: actions/checkout@v4
        if: github.event.inputs.action != 'rollback'

      - uses: actions/setup-node@v4
        if: github.event.inputs.action != 'rollback'
        with:
          node-version: '22'    # 项目要求 ^22.18.0 || >=24.12.0
          cache: 'npm'

      - name: 安装依赖
        if: github.event.inputs.action != 'rollback'
        run: npm ci

      - name: 构建
        if: github.event.inputs.action != 'rollback'
        run: npm run build

      - name: 打包 dist
        if: github.event.inputs.action != 'rollback'
        run: tar -czf mu-mirror-dist.tar.gz -C dist .

      - name: 上传到服务器
        if: github.event.inputs.action != 'rollback'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "mu-mirror-dist.tar.gz"
          target: "/tmp"

      - name: 原子发布（含校验与自动回滚）
        if: github.event.inputs.action != 'rollback'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: sudo /usr/local/bin/deploy-mirror.sh deploy /tmp/mu-mirror-dist.tar.gz
